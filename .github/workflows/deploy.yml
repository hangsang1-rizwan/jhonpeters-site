name: Deploy to Cloudways

# Auto-deploys the site to the Cloudways app on every push to main,
# by calling the Cloudways API to trigger a git pull. No manual "Pull" click.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: cloudways-deploy
  cancel-in-progress: false

env:
  SERVER_ID: "1196670"
  APP_ID: "6730213"
  BRANCH: "main"
  DEPLOY_PATH: "public_html"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudways git pull
        env:
          CW_EMAIL: ${{ secrets.CLOUDWAYS_EMAIL }}
          CW_API_KEY: ${{ secrets.CLOUDWAYS_API_KEY }}
        run: |
          set -uo pipefail

          pull_call () {
            # $1 = Authorization header value
            curl -s -o /tmp/pull.json -w "%{http_code}" -X POST \
              "https://api.cloudways.com/api/v1/git/pull" \
              -H "Authorization: $1" \
              --data-urlencode "server_id=${SERVER_ID}" \
              --data-urlencode "app_id=${APP_ID}" \
              --data-urlencode "branch_name=${BRANCH}" \
              --data-urlencode "deploy_path=${DEPLOY_PATH}"
          }

          echo "===== Method A: use the access token directly as Bearer ====="
          CODE_A=$(pull_call "Bearer ${CW_API_KEY}")
          echo "git/pull HTTP ${CODE_A}"
          echo "response:"; cat /tmp/pull.json; echo
          if [ "${CODE_A}" = "200" ]; then
            echo "==> Deploy triggered (direct token)."; exit 0
          fi

          echo "===== Method B: legacy oauth exchange (email + api_key) ====="
          OAUTH_CODE=$(curl -s -o /tmp/tok.json -w "%{http_code}" -X POST \
            "https://api.cloudways.com/api/v1/oauth/access_token" \
            --data-urlencode "email=${CW_EMAIL}" \
            --data-urlencode "api_key=${CW_API_KEY}")
          echo "oauth HTTP ${OAUTH_CODE}"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/tok.json'))
          except Exception as e:
              print("oauth response not JSON:", open('/tmp/tok.json').read()[:300]); raise SystemExit(0)
          has=bool(d.get('access_token'))
          d2={k:v for k,v in d.items() if k!='access_token'}
          print("oauth has access_token:", has, "| other fields:", d2)
          PY
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/tok.json')).get('access_token',''))" 2>/dev/null || echo "")
          if [ -n "${TOKEN}" ]; then
            CODE_B=$(pull_call "Bearer ${TOKEN}")
            echo "git/pull HTTP ${CODE_B}"
            echo "response:"; cat /tmp/pull.json; echo
            if [ "${CODE_B}" = "200" ]; then
              echo "==> Deploy triggered (oauth token)."; exit 0
            fi
          fi

          echo "::error::Neither direct token nor oauth exchange triggered the pull. See responses above."
          exit 1
